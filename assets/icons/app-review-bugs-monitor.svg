<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- App Store to Play Store Gradient -->
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Radar / Bug Alert Glow -->
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Phone Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Star Gold Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#storeGrad)" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Subtle Background Rings / Radar Waves -->
  <circle cx="256" cy="240" r="180" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3"/>
  <circle cx="256" cy="240" r="220" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>

  <!-- Main Smartphone Canvas -->
  <g filter="url(#shadow)">
    <!-- Phone Outer Body -->
    <rect x="136" y="76" width="240" height="360" rx="40" fill="#1E293B" stroke="#475569" stroke-width="4"/>
    <!-- Phone Inner Screen -->
    <rect x="148" y="90" width="216" height="332" rx="28" fill="url(#screenGrad)"/>
    <!-- Phone Speaker Notch -->
    <rect x="220" y="104" width="72" height="6" rx="3" fill="#64748B"/>
  </g>

  <!-- Store Platform Indicator Bar on Screen -->
  <g transform="translate(172, 130)">
    <!-- iOS / Android Pills -->
    <rect x="0" y="0" width="76" height="22" rx="11" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="38" y="15" fill="#38BDF8" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">iOS RSS</text>

    <rect x="92" y="0" width="76" height="22" rx="11" fill="#059669" fill-opacity="0.3" stroke="#34D399" stroke-width="1.5"/>
    <text x="130" y="15" fill="#34D399" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PLAY</text>
  </g>

  <!-- Rating Stars Display -->
  <g transform="translate(182, 172)">
    <!-- Star 1 (Gold) -->
    <path d="M14 2 l3.5 7.5 8 1 -6 5.5 1.5 8 -7 -4 -7 4 1.5 -8 -6 -5.5 8 -1 z" fill="url(#starGrad)"/>
    <!-- Star 2 (Gold) -->
    <path d="M42 2 l3.5 7.5 8 1 -6 5.5 1.5 8 -7 -4 -7 4 1.5 -8 -6 -5.5 8 -1 z" fill="url(#starGrad)"/>
    <!-- Star 3 (Gold) -->
    <path d="M70 2 l3.5 7.5 8 1 -6 5.5 1.5 8 -7 -4 -7 4 1.5 -8 -6 -5.5 8 -1 z" fill="url(#starGrad)"/>
    <!-- Star 4 (Empty/Gray) -->
    <path d="M98 2 l3.5 7.5 8 1 -6 5.5 1.5 8 -7 -4 -7 4 1.5 -8 -6 -5.5 8 -1 z" fill="#334155"/>
    <!-- Star 5 (Empty/Gray) -->
    <path d="M126 2 l3.5 7.5 8 1 -6 5.5 1.5 8 -7 -4 -7 4 1.5 -8 -6 -5.5 8 -1 z" fill="#334155"/>
  </g>

  <!-- Large Bug Target / Crash Detection Badge (Front & Center) -->
  <g filter="url(#shadow)" transform="translate(256, 290)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="76" fill="url(#alertGrad)" fill-opacity="0.15" stroke="url(#alertGrad)" stroke-width="2" stroke-dasharray="6 4" filter="url(#glow)"/>
    
    <!-- Shield / Target Base -->
    <circle cx="0" cy="0" r="58" fill="url(#alertGrad)" stroke="#FFE4E6" stroke-width="3"/>
    
    <!-- Modern Stylized Bug / Shield Icon -->
    <!-- Bug Head -->
    <ellipse cx="0" cy="-22" rx="14" ry="11" fill="#FFFFFF"/>
    <!-- Bug Antennae -->
    <path d="M-8 -30 Q-16 -40 -20 -38" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M8 -30 Q16 -40 20 -38" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Bug Body -->
    <path d="M-22 -8 C-24 18 -16 32 0 34 C16 32 24 18 22 -8 C22 -14 -22 -14 -22 -8 Z" fill="#FFFFFF"/>
    <!-- Bug Shell Center Cut -->
    <line x1="0" y1="-8" x2="0" y2="33" stroke="#E11D48" stroke-width="3.5"/>
    <!-- Bug Legs -->
    <path d="M-18 -2 Q-36 -10 -40 -4" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M18 -2 Q36 -10 40 -4" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-20 12 Q-40 14 -42 22" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M20 12 Q40 14 42 22" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-14 26 Q-32 36 -32 44" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M14 26 Q32 36 32 44" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Tag Pill: REGRESSION / CRASH -->
  <g transform="translate(256, 436)" filter="url(#shadow)">
    <rect x="-105" y="0" width="210" height="34" rx="17" fill="#0F172A" stroke="#EF4444" stroke-width="2"/>
    <circle cx="-85" cy="17" r="5" fill="#EF4444" filter="url(#glow)"/>
    <text x="-70" y="22" fill="#F8FAFC" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">BUG DETECTED</text>
  </g>
</svg>
