<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Lead / Audit Gradient -->
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#leadGrad)" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Browser Window Frame (Audited Website) -->
  <g filter="url(#shadow)" transform="translate(106, 96)">
    <!-- Browser Container -->
    <rect x="0" y="0" width="300" height="210" rx="20" fill="url(#browserGrad)" stroke="#475569" stroke-width="4"/>
    <!-- Browser Title Bar -->
    <rect x="0" y="0" width="300" height="36" rx="20" fill="#334155"/>
    <!-- Window Controls (Red, Yellow, Green) -->
    <circle cx="20" cy="18" r="6" fill="#EF4444"/>
    <circle cx="38" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="56" cy="18" r="6" fill="#10B981"/>
    <!-- URL Bar -->
    <rect x="76" y="8" width="180" height="20" rx="10" fill="#1E293B"/>
    <text x="166" y="22" fill="#94A3B8" font-family="-apple-system, system-ui, sans-serif" font-size="9" text-anchor="middle">business-website.com</text>

    <!-- Wireframe Lines Inside Window -->
    <rect x="24" y="56" width="100" height="12" rx="4" fill="#38BDF8" fill-opacity="0.6"/>
    <rect x="24" y="78" width="160" height="8" rx="3" fill="#64748B"/>
    <rect x="24" y="94" width="130" height="8" rx="3" fill="#64748B"/>
    
    <!-- Red Alert Flag: Outdated / Broken Site Indicator -->
    <rect x="24" y="120" width="110" height="22" rx="6" fill="#EF4444" fill-opacity="0.25" stroke="#EF4444" stroke-width="1.5"/>
    <text x="79" y="135" fill="#FCA5A5" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">NEEDS REDESIGN</text>
  </g>

  <!-- Large Opportunity Pin / Radar Target -->
  <g filter="url(#shadow)" transform="translate(256, 316)">
    <!-- Outer Radar Pulse Ring -->
    <circle cx="0" cy="-10" r="76" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" filter="url(#glow)"/>
    
    <!-- Local Map Pin Icon -->
    <path d="M0 -70 C-40 -70 -70 -40 -70 0 C-70 34 -20 80 0 102 C20 80 70 34 70 0 C70 -40 40 -70 0 -70 Z" fill="url(#leadGrad)" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Scorecard Center Ring -->
    <circle cx="0" cy="-10" r="34" fill="#0F172A" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- 98 Opportunity Score Inside Pin -->
    <text x="0" y="2" fill="#FBBF24" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">98</text>
  </g>

  <!-- Tag Pill: B2B LEADS & PITCH ANGLES -->
  <g transform="translate(256, 444)" filter="url(#shadow)">
    <rect x="-125" y="0" width="250" height="34" rx="17" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="-105" cy="17" r="5" fill="#F59E0B" filter="url(#glow)"/>
    <text x="10" y="22" fill="#F8FAFC" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">LOCAL LEAD FINDER</text>
  </g>
</svg>
