<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- ATS Brand Gradient (Greenhouse + Lever + Ashby) -->
    <linearGradient id="atsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#atsGrad)" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Briefcase Silhouette -->
  <g filter="url(#shadow)">
    <!-- Briefcase Handle -->
    <path d="M196 140 C196 112 216 92 244 92 L268 92 C296 92 316 112 316 140 L316 156 L196 156 Z" fill="none" stroke="#64748B" stroke-width="14" stroke-linejoin="round"/>
    <!-- Briefcase Body -->
    <rect x="96" y="152" width="320" height="236" rx="36" fill="url(#caseGrad)" stroke="#334155" stroke-width="5"/>
    <!-- Top Flap Divider Line -->
    <path d="M96 236 L210 236 C220 236 228 244 232 254 L240 270 C244 278 252 284 262 284 L276 284 C286 284 294 278 298 270 L306 254 C310 244 318 236 328 236 L416 236" fill="none" stroke="#475569" stroke-width="4"/>
    <!-- Metallic Locks -->
    <rect x="156" y="224" width="24" height="24" rx="6" fill="#10B981" filter="url(#glow)"/>
    <rect x="332" y="224" width="24" height="24" rx="6" fill="#06B6D4" filter="url(#glow)"/>
  </g>

  <!-- Large Data / Search Lens -->
  <g filter="url(#shadow)" transform="translate(256, 300)">
    <!-- Search Lens Ring -->
    <circle cx="0" cy="0" r="70" fill="#0F172A" stroke="url(#atsGrad)" stroke-width="12" filter="url(#glow)"/>
    
    <!-- Code Brackets { } inside Lens representing structured job data -->
    <text x="-26" y="16" fill="#10B981" font-family="monospace" font-size="48" font-weight="900">{</text>
    <text x="6" y="16" fill="#06B6D4" font-family="monospace" font-size="48" font-weight="900">}</text>

    <!-- Briefcase / Job Indicator Dot -->
    <circle cx="0" cy="4" r="6" fill="#F8FAFC"/>

    <!-- Magnifying Glass Handle -->
    <path d="M50 50 L86 86" stroke="url(#atsGrad)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- ATS Platform Pills -->
  <g transform="translate(256, 436)" filter="url(#shadow)">
    <rect x="-140" y="0" width="280" height="34" rx="17" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <text x="0" y="22" fill="#E2E8F0" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">GREENHOUSE • LEVER • ASHBY</text>
  </g>
</svg>
